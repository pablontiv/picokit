done_statuses = ["Completed", "Obsolete"]
active_statuses = ["Pending", "Specified", "In Progress"]
leaf_filter = "isIndex == false"
outcome_close_verify = []
commit_style = "conventional"
auto_push = true
required_code_coverage = 85.0
loop_max_tasks = 0
parallel = true
autonomy = "until_done"
compact_after_task_commit = true
pr_mode = false

[gitflow]
branch_style = "feat|fix|chore|docs/<OXX>-<slug>"
pr_title_style = "<type>(<scope>): <description>"
pr_body_style = "no aplica (pr_mode=false)"

[status_values]
pending = "Pending"
specified = "Specified"
in_progress = "In Progress"
completed = "Completed"
blocked = "Blocked"
obsolete = "Obsolete"
