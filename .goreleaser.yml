version: 2

project_name: picokit

before:
  hooks:
    - go mod tidy

source:
  enabled: true
  name_template: "{{ .ProjectName }}-{{ .Version }}-src"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs?:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^style:"
      - "^refactor:"
