name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: pablontiv/crossbeam/.github/workflows/go-ci.yml@v1
    with:
      go-version-file: go.mod
      coverage-threshold: 85

  gitleaks:
    uses: pablontiv/crossbeam/.github/workflows/gitleaks.yml@v1

  coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... -coverprofile=coverage.out -count=1
      - run: go run ./cmd/pkcov check --profile coverage.out --floors .coverage-floors.toml

  release:
    uses: pablontiv/crossbeam/.github/workflows/go-release.yml@v1
    needs: [ci, gitleaks, coverage-gate]
    if: github.event_name == 'push'
    with:
      quality-gate-jobs: '["ci","gitleaks","coverage-gate"]'
    permissions:
      contents: write
      id-token: write
      attestations: write
